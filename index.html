<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>나의구독쓰</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="나의구독쓰">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.json">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  :root{
    --bg:#FFFFFF; --ink:#111111; --sub:#8A8A88; --line:#E7E7E4; --fill:#F4F4F2; --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);
    font-family:'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5;touch-action:pan-y;overflow-x:hidden}
  body{padding:26px 18px 90px}
  .wrap{max-width:640px;margin:0 auto}
  svg{display:block}
  .num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}

  /* header */
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
  .mark{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;letter-spacing:-.01em}
  .dot{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sub)}
  .dot i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block;transition:background .2s}
  .dot.on i{background:var(--ink)}
  .hdr-right{display:flex;align-items:center;gap:10px}
  .gear{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--bg);
    color:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit}
  .gear:active{transform:translateY(1px)}

  /* hero */
  .hero{border:1px solid var(--line);border-radius:var(--radius);padding:24px 22px 22px;margin-bottom:16px}
  .hero .cap{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--sub);font-weight:600}
  .total{font-size:56px;font-weight:800;line-height:1.02;margin-top:8px}
  .total .cur{font-size:26px;font-weight:700;vertical-align:6px;margin-right:3px}
  .rule{height:1px;background:var(--ink);margin:18px 0 14px;width:56px}
  .stats{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;font-size:14px;font-weight:600}
  .stats b{font-weight:800}
  .stats .sep{color:var(--line);font-weight:400}
  .stats em{font-style:normal;color:var(--sub);font-weight:600;font-size:12px}
  .usd{font-size:13px;color:var(--sub);font-weight:600;margin-top:10px}
  .ratebtn{font-family:inherit;font-size:12px;font-weight:600;color:var(--sub);background:none;border:none;
    padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:5px;border-bottom:1px dotted var(--sub)}
  .ratebtn:active{opacity:.6}

  /* add */
  .addbar{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 26px}
  .add{border:1px solid var(--ink);border-radius:var(--radius);background:var(--bg);color:var(--ink);
    padding:18px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    font-family:inherit;font-size:13px;font-weight:700;transition:transform .08s}
  .add:active{transform:translateY(1px)}
  .add.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}

  /* breakdown */
  .brk{border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:26px;display:none}
  .brow{display:flex;align-items:center;gap:12px;margin-bottom:13px}
  .brow:last-child{margin-bottom:0}
  .brow .ic{width:20px;flex-shrink:0;color:var(--ink)}
  .track{flex:1;height:6px;background:var(--fill);border-radius:6px;overflow:hidden}
  .fill{height:100%;background:var(--ink);border-radius:6px}
  .brow .amt{font-size:12px;color:var(--sub);width:82px;text-align:right;flex-shrink:0;font-weight:600}

  /* list */
  .card{position:relative;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:8px}
  .cardact{position:absolute;top:0;right:0;bottom:0;display:flex}
  .cardact .ca{width:60px;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit}
  .ca.edit{background:var(--fill);color:var(--ink)}
  .ca.del{background:var(--ink);color:#fff}
  .cardface{position:relative;z-index:1;background:var(--bg);display:flex;align-items:flex-start;gap:12px;overflow:hidden;
    padding:14px 16px;touch-action:pan-y;transition:transform .22s cubic-bezier(.2,.8,.2,1);will-change:transform}
  .card.open .cardface{transform:translateX(-120px)}
  .ci{width:22px;flex:0 0 22px;color:var(--ink);align-self:center}
  .name{font-size:16px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    flex:0 1 auto;min-width:56px;align-self:center}
  .cright{margin-left:auto;flex:1 1 auto;min-width:0;text-align:right;padding-left:8px}
  .price{display:flex;align-items:baseline;justify-content:flex-end;gap:3px;white-space:nowrap}
  .price .p{font-size:16px;font-weight:800}
  .price .cy{font-size:11px;color:var(--sub)}
  .sub{font-size:12px;color:var(--sub);margin-top:3px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:2px 9px}
  .sub span{white-space:nowrap}
  .sub b{color:var(--ink);font-weight:700}
  .swipe-hint{text-align:center;font-size:11px;color:var(--sub);margin:2px 0 14px}

  .empty{text-align:center;padding:56px 20px;color:var(--sub)}
  .empty svg{margin:0 auto 16px}
  .empty p{font-size:13px}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.34);display:none;align-items:flex-end;justify-content:center;z-index:50;touch-action:pan-y}
  .overlay.on{display:flex}
  .sheet{background:var(--bg);width:100%;max-width:640px;border-radius:18px 18px 0 0;
    padding:8px 20px 30px;max-height:92vh;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;animation:up .2s ease}
  @keyframes up{from{transform:translateY(24px)}to{transform:none}}
  @media(min-width:640px){.overlay{align-items:center}.sheet{border-radius:18px}}
  .grab{width:38px;height:4px;background:var(--line);border-radius:4px;margin:8px auto 18px}
  .sheet h2{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:16px}
  .preview{width:100%;max-height:170px;object-fit:contain;border:1px solid var(--line);border-radius:10px;margin-bottom:14px;display:none}
  .ai{border:1px solid var(--line);background:var(--fill);border-radius:10px;padding:12px 14px;font-size:12px;color:var(--sub);margin-bottom:16px;display:none}
  .ai.on{display:block}
  .ai b{color:var(--ink)}
  .ai.err{background:#111;color:#fff;border-color:#111}
  .ai.err b{color:#fff}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .field{margin-bottom:13px}
  .field label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px}
  .field input,.field select{width:100%;font-family:inherit;font-size:15px;color:var(--ink);
    padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
  .field input:focus,.field select:focus{outline:none;border-color:var(--ink)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;font-family:inherit;font-size:14px;font-weight:700;padding:11px;border:1px solid var(--line);
    background:var(--bg);color:var(--sub);border-radius:10px;cursor:pointer}
  .seg button.act{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .catgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .catgrid button{font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 2px;
    border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;cursor:pointer;font-size:10px;font-weight:600;
    min-width:0;white-space:nowrap;overflow:hidden}
  .catgrid button svg{color:var(--ink)}
  .catgrid button.act{background:var(--ink);color:var(--bg)}
  .catgrid button.act svg{color:var(--bg)}
  .sheet-actions{display:flex;gap:10px;margin-top:18px}
  .sbtn{flex:1;font-family:inherit;font-size:15px;font-weight:800;padding:14px;border-radius:11px;cursor:pointer;border:1px solid var(--ink)}
  .sbtn.cancel{background:var(--bg);color:var(--ink)}
  .sbtn.ok{background:var(--ink);color:var(--bg)}

  /* crop */
  .cropov{position:fixed;inset:0;background:#000;z-index:60;display:none;flex-direction:column}
  .cropov.on{display:flex}
  .crophead{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;color:#fff;font-size:14px;font-weight:700}
  .cropx{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;padding:4px 8px;font-family:inherit}
  .cropstage{flex:1;position:relative;margin:0 auto;touch-action:none;user-select:none;align-self:center}
  #cropimg{width:100%;height:100%;display:block;pointer-events:none}
  .cropbox{position:absolute;border:1.5px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.6);box-sizing:border-box;cursor:move}
  .hd{position:absolute;width:14px;height:14px;background:#fff;border-radius:2px}
  .hd::after{content:"";position:absolute;inset:-12px}
  .hd.tl{top:-7px;left:-7px;cursor:nwse-resize}
  .hd.tr{top:-7px;right:-7px;cursor:nesw-resize}
  .hd.bl{bottom:-7px;left:-7px;cursor:nesw-resize}
  .hd.br{bottom:-7px;right:-7px;cursor:nwse-resize}
  .cropactions{display:flex;gap:10px;padding:16px 20px calc(16px + env(safe-area-inset-bottom))}
  .cropactions .sbtn.cancel{background:transparent;color:#fff;border-color:#555}
  .cropactions .sbtn.ok{background:#fff;color:#000;border-color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2Z"/><path d="M9 8h6M9 12h6"/></svg>
      나의구독쓰
    </div>
    <div class="hdr-right">
      <div class="dot" id="saveDot"><i></i><span id="saveTxt">저장됨</span></div>
      <button class="gear" onclick="setKey()" title="AI 키 설정"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
    </div>
  </header>

  <div class="hero">
    <div class="cap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16v12H4z"/><path d="M4 10h16"/></svg>
      월 구독료
    </div>
    <div class="total num"><span class="cur">₩</span><span id="totalMonthly">0</span></div>
    <div class="rule"></div>
    <div class="stats">
      <span>총 구독 <b id="count">0</b>개</span>
      <span class="sep">/</span>
      <span class="num"><b id="totalYearly">₩0</b> <em>(년)</em></span>
    </div>
    <div class="usd" id="usd"></div>
  </div>

  <div class="addbar">
    <button class="add primary" onclick="pasteText()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5l8.5 6 8.5-6"/></svg>
      문자
    </button>
    <button class="add" onclick="pickReceipt()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg>
      사진
    </button>
    <button class="add" onclick="openForm()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 5v14M5 12h14"/></svg>
      직접
    </button>
  </div>
  <input type="file" id="receiptInput" accept="image/*" style="display:none" onchange="handleReceipt(event)">

  <div class="brk" id="brk"></div>
  <div id="list"></div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="grab"></div>
    <h2 id="sheetTitle"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg><span>추가</span></h2>

    <img id="previewImg" class="preview" alt="">
    <div class="ai" id="aiStatus"></div>

    <div class="field">
      <label>이름</label>
      <input id="fName" placeholder="Netflix, Adobe CC…">
    </div>

    <div class="field">
      <label>카테고리</label>
      <div class="catgrid" id="fCats"></div>
    </div>

    <div class="field">
      <label>주기</label>
      <div class="seg">
        <button id="cycM" onclick="setCycle('monthly')">월</button>
        <button id="cycY" onclick="setCycle('yearly')">년</button>
      </div>
    </div>

    <div class="row2">
      <div class="field"><label>금액</label><input id="fAmount" type="number" inputmode="numeric" placeholder="13500"></div>
      <div class="field"><label>통화</label><select id="fCur"><option value="KRW">₩</option><option value="USD">$</option></select></div>
    </div>

    <div class="row2">
      <div class="field"><label>시작일</label><input id="fStart" type="date"></div>
      <div class="field"><label>다음 결제</label><input id="fNext" type="date"></div>
    </div>

    <div class="field"><label>메모</label><input id="fMemo" placeholder=""></div>

    <div class="sheet-actions">
      <button class="sbtn cancel" onclick="closeForm()">취소</button>
      <button class="sbtn ok" onclick="saveForm()">저장</button>
    </div>
  </div>
</div>

<div class="cropov" id="cropov">
  <div class="crophead"><span>사진 자르기</span><button class="cropx" onclick="closeCrop()">✕</button></div>
  <div class="cropstage" id="cropstage">
    <img id="cropimg" alt="">
    <div class="cropbox" id="cropbox">
      <span class="hd tl" data-c="tl"></span><span class="hd tr" data-c="tr"></span>
      <span class="hd bl" data-c="bl"></span><span class="hd br" data-c="br"></span>
    </div>
  </div>
  <div class="cropactions">
    <button class="sbtn cancel" onclick="useFull()">전체 사용</button>
    <button class="sbtn ok" onclick="applyCrop()">자르기</button>
  </div>
</div>

<script>
/* storage: use Claude artifact storage if present, else localStorage */
const STORE=(window.storage&&typeof window.storage.get==='function')?window.storage:{
  async get(k){const v=localStorage.getItem(k);if(v===null)throw new Error('missing');return{key:k,value:v};},
  async set(k,v){localStorage.setItem(k,v);return{key:k,value:v};},
  async delete(k){localStorage.removeItem(k);return{key:k,deleted:true};}
};

const ICONS={
  ott:'<path d="M4 5h16v12H4z"/><path d="M10 8.5v5l4-2.5z"/><path d="M8 20h8"/>',
  design:'<path d="M12 3l3 6-3 12-3-12z"/><path d="M9 9h6"/>',
  ai:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
  cloud:'<path d="M7 18a4 4 0 0 1 0-8 5 5 0 0 1 9.6-1A3.5 3.5 0 0 1 17 18z"/>',
  work:'<rect x="3" y="7" width="18" height="12" rx="2"/><path d="M9 7V5h6v2"/>',
  news:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/>',
  game:'<rect x="4" y="7" width="16" height="10" rx="2"/><circle cx="8.5" cy="12" r="1.2"/><path d="M15.5 10v4"/><path d="M13.5 12h4"/>',
  etc:'<circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/>'
};
const CATS=[
  {v:'ott',l:'영상·음악'},{v:'design',l:'디자인'},{v:'ai',l:'AI'},{v:'cloud',l:'저장'},
  {v:'work',l:'업무'},{v:'news',l:'구독물'},{v:'game',l:'게임'},{v:'etc',l:'기타'}
];
const svgIcon=(v,size=22)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[v]||ICONS.etc}</svg>`;
const catLabel=v=>(CATS.find(c=>c.v===v)||CATS[7]).l;

let subs=[], editId=null, formCat='etc', formCycle='monthly', rate=1400, openCard=null;

async function load(){
  try{const r=await STORE.get('subscriptions');if(r&&r.value)subs=JSON.parse(r.value);}catch(e){subs=[];}
  subs.forEach(s=>{s.amount=Number(s.amount)||0;});
  try{const rr=await STORE.get('usdRate');if(rr&&rr.value)rate=parseFloat(rr.value)||rate;}catch(e){}
  render();
}
async function save(){try{await STORE.set('subscriptions',JSON.stringify(subs));flashSaved();}catch(e){document.getElementById('saveTxt').textContent='임시';}}
async function saveRate(){try{await STORE.set('usdRate',String(rate));flashSaved();}catch(e){}}
function editRate(){const v=prompt('환율 설정 · $1 = ₩ ?',rate);if(v===null)return;const n=parseFloat(String(v).replace(/[^0-9.]/g,''));if(n>0){rate=Math.round(n);saveRate();render();}}
const toKRW=s=>monthlyEq(s)*(s.currency==='USD'?rate:1);
let st;
function flashSaved(){const d=document.getElementById('saveDot');d.classList.add('on');document.getElementById('saveTxt').textContent='저장됨';clearTimeout(st);st=setTimeout(()=>d.classList.remove('on'),1400);}

function fmt(n,cur){if(cur==='USD')return '$'+(Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});return '₩'+Math.round(n).toLocaleString('ko-KR');}
const monthlyEq=s=>{const a=Number(s.amount)||0;return s.cycle==='yearly'?a/12:a;};
function durationText(iso){if(!iso)return null;const s=new Date(iso),n=new Date();if(isNaN(s))return null;let m=(n.getFullYear()-s.getFullYear())*12+(n.getMonth()-s.getMonth());if(n.getDate()<s.getDate())m--;if(m<0)return null;const y=Math.floor(m/12),mm=m%12;return{text:(y>0?y+'년 ':'')+mm+'개월',months:m};}
const esc=t=>(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  let krwM=0;const byCat={};
  subs.forEach(s=>{const eq=toKRW(s);krwM+=eq;byCat[s.category]=(byCat[s.category]||0)+eq;});
  document.getElementById('totalMonthly').textContent=Math.round(krwM).toLocaleString('ko-KR');
  document.getElementById('totalYearly').textContent=fmt(krwM*12,'KRW');
  document.getElementById('count').textContent=subs.length;
  const hasUSD=subs.some(s=>s.currency==='USD');
  document.getElementById('usd').innerHTML=hasUSD?`<button class="ratebtn" onclick="editRate()">$ 환산 포함 · $1=₩${rate.toLocaleString('ko-KR')} <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4L18 10l-4-4L4 16z"/><path d="M13 5l4 4"/></svg></button>`:'';

  const brk=document.getElementById('brk');
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  if(cats.length){const max=Math.max(...cats.map(c=>c[1]));brk.style.display='block';
    brk.innerHTML=cats.map(([c,v])=>`<div class="brow"><span class="ic">${svgIcon(c,20)}</span><span class="track"><span class="fill" style="width:${Math.max(6,v/max*100)}%"></span></span><span class="amt num">${fmt(v,'KRW')}</span></div>`).join('');
  }else brk.style.display='none';

  const list=document.getElementById('list');
  if(!subs.length){list.innerHTML=`<div class="empty"><svg width="56" height="44" viewBox="0 0 56 44" fill="none" stroke="#E7E7E4" stroke-width="2"><rect x="7" y="5" width="42" height="34" rx="4"/><path d="M7 15h42"/><path d="M18 27l4-4 4 4 4-5" stroke="#111"/></svg><p>영수증을 올리거나 직접 추가하세요</p></div>`;return;}
  const sorted=[...subs].sort((a,b)=>toKRW(b)-toKRW(a));

        <button class="ca del" data-act="del" data-id="${s.id}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14M9 7V5h6v2M7 7l1 12h8l1-12"/></svg></button>

async function runReceiptAI(b64,mime,previewSrc){
  openForm();setTitle('영수증');

  }catch(err){
    status.className='ai on err';

      BADKEY:'<b>API 키 오류</b><br>⚙︎ 에서 다시 넣어주세요.',
      QUOTA:'<b>오늘 사용량 초과</b><br>내일 다시 되거나, 문자 붙여넣기를 쓰세요.',
      SLOW:'<b>응답이 느려요</b><br>문자 붙여넣기가 훨씬 빨라요.',
      NET:'<b>네트워크 오류</b><br>연결을 확인해주세요.'};
    status.innerHTML=(M[err.message]||'<b>인식 실패</b>')+'<br>아래에 직접 입력하세요.'+
      (err.detail?`<br><span style="opacity:.7;font-size:11px">${esc(err.detail)}</span>`:'');
  }
}

/* ---------- cropper ---------- */
let crop={x:0,y:0,w:0,h:0},dispW=0,dispH=0,cropDrag=null;
function openCrop(dataURL){
  const img=document.getElementById('cropimg');
  img.onload=()=>{
    const stage=document.getElementById('cropstage');
    const maxW=Math.min(window.innerWidth,640)-40;
    const maxH=window.innerHeight-190;
    const r=img.naturalWidth/img.naturalHeight;
    dispW=maxW; dispH=maxW/r;
    if(dispH>maxH){dispH=maxH;dispW=maxH*r;}
    stage.style.width=dispW+'px';stage.style.height=dispH+'px';
    const inset=Math.min(dispW,dispH)*0.06;
    crop={x:inset,y:inset,w:dispW-inset*2,h:dispH-inset*2};
    drawCrop();
  };
  img.src=dataURL;
  document.getElementById('cropov').classList.add('on');
}
function closeCrop(){document.getElementById('cropov').classList.remove('on');document.getElementById('cropimg').src='';}
function drawCrop(){const b=document.getElementById('cropbox');b.style.left=crop.x+'px';b.style.top=crop.y+'px';b.style.width=crop.w+'px';b.style.height=crop.h+'px';}
function stagePt(e){const s=document.getElementById('cropstage').getBoundingClientRect();return{x:Math.max(0,Math.min(dispW,e.clientX-s.left)),y:Math.max(0,Math.min(dispH,e.clientY-s.top))};}
function onDown(e){
  const c=e.target.dataset&&e.target.dataset.c;
  const p=stagePt(e);
  if(c){cropDrag={mode:c};}
  else if(e.target.id==='cropbox'){cropDrag={mode:'move',ox:p.x-crop.x,oy:p.y-crop.y};}
  else return;
  e.target.setPointerCapture&&e.target.setPointerCapture(e.pointerId);
  e.preventDefault();
}
function onMove(e){
  if(!cropDrag)return;
  const p=stagePt(e),MIN=44;
  if(cropDrag.mode==='move'){
    crop.x=Math.max(0,Math.min(dispW-crop.w,p.x-cropDrag.ox));
    crop.y=Math.max(0,Math.min(dispH-crop.h,p.y-cropDrag.oy));
  }else{
    let x1=crop.x,y1=crop.y,x2=crop.x+crop.w,y2=crop.y+crop.h;
    if(cropDrag.mode.includes('l'))x1=Math.min(p.x,x2-MIN);
    if(cropDrag.mode.includes('r'))x2=Math.max(p.x,x1+MIN);
    if(cropDrag.mode.includes('t'))y1=Math.min(p.y,y2-MIN);
    if(cropDrag.mode.includes('b'))y2=Math.max(p.y,y1+MIN);
    crop={x:x1,y:y1,w:x2-x1,h:y2-y1};
  }
  drawCrop();e.preventDefault();
}
function onUp(){cropDrag=null;}
function shrink(cv,maxSide){
  const w=cv.width,h=cv.height,m=Math.max(w,h);
  if(m<=maxSide)return cv;
  const s=maxSide/m;
  const out=document.createElement('canvas');
  out.width=Math.round(w*s);out.height=Math.round(h*s);
  out.getContext('2d').drawImage(cv,0,0,out.width,out.height);
  return out;
}
function applyCrop(){
  const img=document.getElementById('cropimg');
  const sx=img.naturalWidth/dispW;
  let cv=document.createElement('canvas');
  cv.width=Math.round(crop.w*sx);cv.height=Math.round(crop.h*sx);
  cv.getContext('2d').drawImage(img,crop.x*sx,crop.y*sx,crop.w*sx,crop.h*sx,0,0,cv.width,cv.height);
  cv=shrink(cv,1100);
  const url=cv.toDataURL("image/jpeg",0.8);
  closeCrop();runReceiptAI(url.split(',')[1],'image/jpeg',url);
}
function useFull(){
  const img=document.getElementById('cropimg');
  let cv=document.createElement('canvas');
  cv.width=img.naturalWidth;cv.height=img.naturalHeight;
  cv.getContext('2d').drawImage(img,0,0);
  cv=shrink(cv,1100);
  const url=cv.toDataURL("image/jpeg",0.8);
  closeCrop();runReceiptAI(url.split(',')[1],'image/jpeg',url);
}
function toBase64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=()=>rej(new Error('e'));r.readAsDataURL(file);});}
const RECEIPT_PROMPT=`이미지는 구독 결제 영수증, 결제 내역, 또는 카드 결제 문자 캡처야. 읽어서 JSON 하나만 출력해.
{"name":"서비스명","amount":숫자,"currency":"KRW"|"USD","cycle":"monthly"|"yearly","startDate":"YYYY-MM-DD"|null,"nextPayment":"YYYY-MM-DD"|null,"category":"ott"|"design"|"ai"|"cloud"|"work"|"news"|"game"|"etc","note":"짧은 한글 메모"}
규칙: 결제대행사 표기(PAYPAL*, GOOGLE*, PADDLE*, APPLE.COM/BILL)는 떼고 실제 서비스명만. USD 표기면 currency는 USD. 주기 미상이면 monthly. amount는 숫자만.`;

/* ---------- 텍스트 파서 (AI 불필요) ---------- */
const BRANDS=[
  [/capcut/i,'CapCut','design'],[/adobe|creative ?cloud/i,'Adobe CC','design'],[/figma/i,'Figma','design'],
  [/canva/i,'Canva','design'],[/netflix|넷플릭스/i,'Netflix','ott'],[/youtube|유튜브/i,'YouTube Premium','ott'],
  [/spotify|스포티파이/i,'Spotify','ott'],[/disney/i,'Disney+','ott'],[/tving|티빙/i,'TVING','ott'],
  [/wavve|웨이브/i,'Wavve','ott'],[/watcha|왓챠/i,'왓챠','ott'],[/coupang|쿠팡/i,'쿠팡플레이','ott'],
  [/melon|멜론/i,'멜론','ott'],[/openai|chatgpt/i,'ChatGPT','ai'],[/anthropic|claude/i,'Claude','ai'],
  [/midjourney/i,'Midjourney','ai'],[/runway/i,'Runway','ai'],[/elevenlabs/i,'ElevenLabs','ai'],
  [/higgsfield/i,'Higgsfield','ai'],[/suno/i,'Suno','ai'],[/notion|노션/i,'Notion','work'],
  [/slack/i,'Slack','work'],[/dropbox/i,'Dropbox','cloud'],[/icloud|apple\.com\/bill/i,'iCloud','cloud'],
  [/google ?one|구글원/i,'Google One','cloud'],[/microsoft|office ?365|m365/i,'Microsoft 365','work'],
  [/github/i,'GitHub','work'],[/steam/i,'Steam','game'],[/nintendo/i,'Nintendo','game'],
  [/playstation|psn/i,'PlayStation Plus','game'],[/xbox/i,'Xbox','game'],[/millie|밀리의서재/i,'밀리의 서재','news'],
];
function parseReceiptText(raw){
  const t=(raw||'').replace(/\u00a0/g,' ').trim();
  if(!t)return null;
  const out={name:null,amount:null,currency:'KRW',cycle:'monthly',startDate:null,nextPayment:null,category:'etc',note:''};

  // 금액 + 통화
  let m=t.match(/(?:USD|US\$|\$)\s*([\d,]+(?:\.\d+)?)/i);
  if(m){out.amount=parseFloat(m[1].replace(/,/g,''));out.currency='USD';}
  else{
    m=t.match(/([\d,]+)\s*원/)||t.match(/(?:KRW|₩)\s*([\d,]+)/i);
    if(m){out.amount=parseFloat(m[1].replace(/,/g,''));out.currency='KRW';}
    else{
      const nums=t.match(/[\d,]{3,}/g);
      if(nums){const big=nums.map(n=>parseFloat(n.replace(/,/g,''))).filter(n=>n>=100);if(big.length)out.amount=big[0];}
    }
  }

  // 주기
  if(/연간|1\s*year|annual|yearly|\/\s*년|매년/i.test(t))out.cycle='yearly';

  // 날짜
  let d=t.match(/(20\d{2})[.\-/년]\s*(\d{1,2})[.\-/월]\s*(\d{1,2})/);
  if(d)out.nextPayment=`${d[1]}-${String(d[2]).padStart(2,'0')}-${String(d[3]).padStart(2,'0')}`;
  else{
    // MM/DD 형태만 인정 (금액 소수점 53.17 오인 방지: 슬래시 우선, 점은 월/일 범위 검사)
    d=t.match(/(?:^|[^\d.])(\d{1,2})\/(\d{1,2})(?![\d.])/);
    if(!d){
      const c=t.match(/(?:^|[^\d.])(\d{1,2})\.(\d{1,2})(?![\d.])/);
      if(c&&+c[1]>=1&&+c[1]<=12&&+c[2]>=1&&+c[2]<=31)d=c;
    }
    if(d&&+d[1]>=1&&+d[1]<=12&&+d[2]>=1&&+d[2]<=31){
      const y=new Date().getFullYear();
      out.nextPayment=`${y}-${String(d[1]).padStart(2,'0')}-${String(d[2]).padStart(2,'0')}`;
    }
  }

  // 서비스명 — 브랜드 사전 우선
  for(const [re,name,cat] of BRANDS){
    if(re.test(t)){out.name=name;out.category=cat;break;}
  }
  // 사전에 없으면 가맹점 표기에서 추출
  if(!out.name){
    let g=t.match(/(?:PAYPAL|GOOGLE|PADDLE|STRIPE|FASTSPRING|APPLE)\s*[*\/]\s*([A-Za-z0-9 .\-]{2,30})/i);
    if(!g)g=t.match(/\b([A-Za-z][A-Za-z0-9 .\-]{2,28})\b(?=\s*$)/m);
    if(g)out.name=g[1].trim().replace(/\s{2,}/g,' ');
  }
  if(!out.name&&out.amount===null)return null;
  return out;
}

const GEMINI_MODEL='gemini-3.6-flash';
let apiKey='';
async function loadKey(){try{const r=await STORE.get('geminiKey');if(r&&r.value)apiKey=r.value;}catch(e){}}
async function setKey(){
  const v=prompt('Gemini API 키를 붙여넣으세요.\n\naistudio.google.com/apikey 에서 무료 발급',apiKey||'');
  if(v===null)return false;
  apiKey=v.trim();
  try{await STORE.set('geminiKey',apiKey);}catch(e){}
  return !!apiKey;
}
async function readReceipt(b64,mime){
  if(!apiKey){const ok=await setKey();if(!ok)throw new Error('NOKEY');}
  const body=JSON.stringify({
    contents:[{parts:[{inline_data:{mime_type:mime,data:b64}},{text:RECEIPT_PROMPT}]}],
    generationConfig:{response_mime_type:'application/json'}
  });
  const ctl=new AbortController();
  const timer=setTimeout(()=>ctl.abort(),15000);
  let r;
  try{
    r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`,
      {method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':apiKey},body,signal:ctl.signal});
  }catch(e){
    clearTimeout(timer);
    throw new Error(e.name==='AbortError'?'SLOW':'NET');
  }
  clearTimeout(timer);
  if(!r.ok){
    let msg='';try{const j=await r.json();msg=j?.error?.message||'';}catch(_){}
    if(r.status===403||/API key not valid|API_KEY_INVALID/i.test(msg))throw new Error('BADKEY');
    if(r.status===429)throw new Error('QUOTA');
    const e=new Error('FAIL');e.detail=`${r.status} ${msg.slice(0,70)}`;throw e;
  }
  const data=await r.json();
  let text=(data?.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('').replace(/```json|```/g,'').trim();
  const a=text.indexOf('{'),b=text.lastIndexOf('}');
  if(a<0||b<0){const e=new Error('FAIL');e.detail='JSON 아님';throw e;}
  return JSON.parse(text.slice(a,b+1));
}

/* list: swipe or tap to reveal edit/delete */
const listEl=document.getElementById('list');
let sw=null;
function closeOthers(except){document.querySelectorAll('.card.open').forEach(c=>{if(c!==except)c.classList.remove('open');});}
listEl.addEventListener('pointerdown',e=>{
  if(e.target.closest('.ca'))return;
  const face=e.target.closest('.cardface');if(!face)return;
  const card=face.closest('.card');
  sw={card,face,sx:e.clientX,sy:e.clientY,base:card.classList.contains('open')?-120:0,moved:false,horiz:false};
});
listEl.addEventListener('pointermove',e=>{
  if(!sw)return;
  const dx=e.clientX-sw.sx,dy=e.clientY-sw.sy;
  if(!sw.horiz){
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>6){sw.horiz=true;sw.face.style.transition='none';try{sw.face.setPointerCapture(e.pointerId);}catch(_){}}
    else if(Math.abs(dy)>8){sw=null;return;}
    else return;
  }
  sw.moved=true;
  sw.face.style.transform='translateX('+Math.max(-120,Math.min(0,sw.base+dx))+'px)';
  e.preventDefault();
});
function endSwipe(e){
  if(!sw)return;
  const card=sw.card,face=sw.face;
  face.style.transition='';face.style.transform='';
  let willOpen;
  if(sw.horiz&&sw.moved){willOpen=(sw.base+(e.clientX-sw.sx))<-60;}
  else if(!sw.moved){willOpen=!card.classList.contains('open');}
  else{sw=null;return;}
  closeOthers(willOpen?card:null);
  card.classList.toggle('open',willOpen);
  openCard=willOpen?card:null;
  sw=null;
}
listEl.addEventListener('pointerup',endSwipe);
listEl.addEventListener('pointercancel',()=>{if(sw){sw.face.style.transition='';sw.face.style.transform='';sw=null;}});
listEl.addEventListener('click',e=>{
  const btn=e.target.closest('.ca');if(!btn)return;
  const id=btn.dataset.id;
  if(btn.dataset.act==='edit')openForm(id);else del(id);
});
